<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Initiative Order</title>
<style>
  :root {
    --bg: #0d0f1a;
    --bg2: #111422;
    --surface: #161b30;
    --border: #1e2a4a;
    --text: #e8eaf6;
    --text2: #8a94bc;
    --text3: #4a5480;
    --gold: #f5a623;
    --gold-dim: #a86e12;
    --blue: #4a9eff;
    --blue-dim: #1e4a8a;
    --active-glow: rgba(74, 158, 255, 0.12);
    --font: 'Segoe UI', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
  }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 32px 40px;
    min-height: 100vh;
  }

  .title-row {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 28px;
    gap: 6px;
  }
  .title {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: var(--text3);
  }
  .round-display {
    font-size: 44px;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 0.04em;
    line-height: 1;
  }
  .round-sub {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--gold-dim);
    margin-top: 2px;
  }

  .initiative-list {
    width: 100%;
    max-width: 600px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .turn-row {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px 20px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    transition: all 0.25s ease;
    position: relative;
    overflow: hidden;
  }
  .turn-row.active {
    background: var(--active-glow);
    border-color: var(--blue);
    box-shadow: 0 0 0 1px var(--blue-dim);
  }
  .turn-row.active::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 4px;
    background: var(--blue);
    border-radius: 10px 0 0 10px;
  }

  .marker-col {
    width: 32px;
    font-size: 28px;
    color: var(--blue);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .init-col {
    width: 72px;
    text-align: center;
    font-size: 30px;
    font-weight: 700;
    color: var(--gold);
    flex-shrink: 0;
    line-height: 1;
  }
  .init-col.inactive {
    color: var(--text3);
    font-size: 25px;
    font-weight: 400;
  }
  .name-col {
    flex: 1;
    font-size: 27px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.1;
  }
  .name-col.inactive {
    font-size: 22px;
    font-weight: 400;
    color: var(--text2);
  }

  .turn-number {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--surface);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 600;
    color: var(--text3);
    flex-shrink: 0;
  }
  .turn-row.active .turn-number {
    background: var(--blue-dim);
    border-color: var(--blue);
    color: var(--blue);
  }

  .empty-state {
    color: var(--text3);
    font-size: 16px;
    text-align: center;
    margin-top: 60px;
    font-style: italic;
    letter-spacing: 0.02em;
  }

  .watermark {
    position: fixed;
    bottom: 16px;
    right: 20px;
    font-size: 11px;
    color: var(--text3);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    opacity: 0.5;
  }

  /* Animate active row in */
  @keyframes activePulse {
    0%   { box-shadow: 0 0 0 0 rgba(74,158,255,0.3); }
    50%  { box-shadow: 0 0 0 6px rgba(74,158,255,0); }
    100% { box-shadow: 0 0 0 0 rgba(74,158,255,0); }
  }
  .turn-row.active.pulse {
    animation: activePulse 0.5s ease-out forwards;
  }
</style>
</head>
<body>

<div class="title-row">
  <div class="title">Initiative Order</div>
  <div class="round-display" id="roundDisplay">—</div>
  <div class="round-sub" id="roundSub"></div>
</div>

<div class="initiative-list" id="initiativeList">
  <div class="empty-state">Waiting for GM to start encounter…</div>
</div>

<div class="watermark">Pathfinder 2e / Starfinder 2e</div>

<script>
const STORAGE_KEY = 'pf2e_initiative_state';
let lastActiveIndex = -1;

function render(data) {
  const { initiativeList, activeIndex, roundCount } = data;

  const roundEl = document.getElementById('roundDisplay');
  const subEl = document.getElementById('roundSub');

  if (roundCount > 0) {
    roundEl.textContent = roundCount;
    subEl.textContent = 'Round';
  } else {
    roundEl.textContent = '—';
    subEl.textContent = '';
  }

  const container = document.getElementById('initiativeList');
  container.innerHTML = '';

  if (!initiativeList || initiativeList.length === 0) {
    container.innerHTML = '<div class="empty-state">Waiting for GM to start encounter…</div>';
    return;
  }

  const shouldPulse = activeIndex !== lastActiveIndex;

  initiativeList.forEach((ch, i) => {
    const isActive = i === activeIndex;

    const row = document.createElement('div');
    row.className = 'turn-row' + (isActive ? ' active' : '');
    if (isActive && shouldPulse) {
      setTimeout(() => row.classList.add('pulse'), 10);
    }

    const markerDiv = document.createElement('div');
    markerDiv.className = 'marker-col';
    markerDiv.textContent = isActive ? '▶' : '';
    row.appendChild(markerDiv);

    const initDiv = document.createElement('div');
    initDiv.className = 'init-col' + (isActive ? '' : ' inactive');
    initDiv.textContent = ch.initiative;
    row.appendChild(initDiv);

    const nameDiv = document.createElement('div');
    nameDiv.className = 'name-col' + (isActive ? '' : ' inactive');
    nameDiv.textContent = ch.name;
    row.appendChild(nameDiv);

    const numDiv = document.createElement('div');
    numDiv.className = 'turn-number';
    numDiv.textContent = i + 1;
    row.appendChild(numDiv);

    container.appendChild(row);
  });

  lastActiveIndex = activeIndex;
}

function poll() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      render(data);
    }
  } catch(e) {}
}

poll();
setInterval(poll, 500);

window.addEventListener('storage', e => {
  if (e.key === STORAGE_KEY) poll();
});
</script>
</body>
</html>
